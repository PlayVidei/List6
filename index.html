<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Video Player - PIDOY Full Image Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen p-2 sm:p-4 font-sans">

  <!-- Mobile Frame Container -->
  <div class="relative w-full max-w-md h-[92vh] bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl flex flex-col">
    
    <!-- Top Bar Navigation dengan Logo PIDOY -->
    <div class="bg-gradient-to-b from-black/90 to-transparent p-3 z-10 flex items-center justify-between absolute top-0 left-0 right-0">
      <div class="flex items-center gap-2">
        <span class="text-xl font-extrabold italic -skew-x-12 tracking-wider bg-gradient-to-r from-orange-500 via-red-500 to-amber-400 bg-clip-text text-transparent drop-shadow-[0_2px_4px_rgba(249,115,22,0.4)]">
          PIDOY
        </span>
        <span class="text-[10px] bg-red-600/80 text-white font-bold px-1.5 py-0.5 rounded italic">HD</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-gray-400">
        <span id="sessionCounter" class="bg-gray-800/80 px-2.5 py-1 rounded-full text-orange-400 font-bold border border-orange-500/30">
          Sesi 0/5
        </span>
      </div>
    </div>

    <!-- Video Area Container -->
    <div class="relative w-full h-full bg-black flex items-center justify-center overflow-hidden">
      
      <!-- Video Embed Iframe -->
      <iframe 
        id="videyFrame" 
        src="https://vski.cc/e/zn2x30rexqdp" 
        class="w-full h-full border-0" 
        allow="autoplay; encrypted-media; picture-in-picture" 
        allowfullscreen>
      </iframe>

      <!-- Custom Initial Play Overlay -->
      <div id="startOverlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm z-20 flex flex-col items-center justify-center cursor-pointer transition-opacity duration-300">
        <button id="btnStart" class="w-20 h-20 bg-orange-500 hover:bg-orange-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-orange-500/40 transition-transform active:scale-95">
          <i class="fa-solid fa-play text-3xl ml-1"></i>
        </button>
        <p class="mt-4 text-sm font-medium text-gray-200">Klik untuk memutar video</p>
      </div>

      <!-- Shopee Overlay Container (Full Overlay Ad) -->
      <div id="shopeeOverlay" class="absolute inset-0 z-30 hidden flex-col justify-between bg-black/80 backdrop-blur-xs transition-opacity duration-300 p-3">
        
        <!-- Top Ad Controls & Real Close (Terpisah di Atas) -->
        <div class="w-full flex justify-between items-start z-50">
          <div class="flex items-center gap-1.5 bg-orange-600 text-white text-xs px-2.5 py-1 rounded-full font-bold shadow-md">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Shopee Promo</span>
          </div>

          <div class="flex flex-col items-end gap-2">
            <!-- Tombol X Transparan (Real Close) -->
            <button id="btnRealClose" class="w-8 h-8 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center bg-black/50 text-white rounded-full text-xs cursor-pointer border border-white/20 shadow-md">
              <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Tombol X Palsu (Fake Close) -->
            <button id="btnFakeClose" class="w-8 h-8 bg-black/70 border border-white/20 text-white rounded-full flex items-center justify-center text-sm shadow-md active:opacity-75">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Banner Produk Sebesar Layar Overlay -->
        <div id="shopeeAdLink" class="my-auto w-full h-[75%] bg-gray-900 rounded-2xl border border-orange-500/50 overflow-hidden shadow-2xl cursor-pointer relative flex flex-col justify-between animate-pulse-slow">
          
          <!-- Full Size Image Container -->
          <div class="relative w-full h-full bg-gray-950 overflow-hidden flex items-center justify-center">
            <img id="adProductImg" src="" alt="Shopee Product" class="w-full h-full object-contain">
            
            <div class="absolute top-3 left-3 bg-red-600 text-white text-xs font-extrabold px-2.5 py-1 rounded shadow-md">
              FLASH SALE SHOPEE
            </div>

            <!-- Floating CTA Bar di atas bagian bawah gambar -->
            <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black via-black/80 to-transparent flex flex-col gap-1.5">
              <h3 id="adTitle" class="text-xs font-bold text-gray-100 line-clamp-1">
                --
              </h3>
              <div class="flex items-center justify-between">
                <div>
                  <span class="text-[10px] text-gray-400 line-through mr-1" id="adOriginalPrice">Rp 150.000</span>
                  <span class="text-sm font-extrabold text-orange-500" id="adDiscountPrice">Rp 69.000</span>
                </div>
                <button class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-md flex items-center gap-1.5">
                  <i class="fa-solid fa-cart-shopping"></i>
                  <span>Beli di Shopee</span>
                </button>
              </div>
            </div>
          </div>

        </div>

        <!-- Bottom Session Status Bar -->
        <div class="w-full text-center text-[11px] text-gray-400 bg-black/40 py-1 rounded-full backdrop-blur-xs z-40">
          Sesi Promo: <span id="overlaySessionText" class="text-orange-400 font-bold">1 / 5</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Konfigurasi 5 Produk Overlay
    const shopeeProducts = [
      {
        title: "Promo Spesial Shopee - Produk 1",
        originalPrice: "Rp 150.000",
        discountPrice: "Rp 69.000",
        image: "https://i.ibb.co.com/tw61Mx1r/Screenshot-2026-1106-212834.png",
        url: "https://s.shopee.co.id/9APzBs2ICW"
      },
      {
        title: "Promo Spesial Shopee - Produk 2",
        originalPrice: "Rp 199.000",
        discountPrice: "Rp 85.000",
        image: "https://i.ibb.co.com/2zVKwWM/Screenshot-2026-1106-212751.png",
        url: "https://shopee.co.id"
      },
      {
        title: "Promo Spesial Shopee - Produk 3",
        originalPrice: "Rp 120.000",
        discountPrice: "Rp 49.000",
        image: "https://i.ibb.co.com/PsCy67pZ/Screenshot-2026-1106-212530.png",
        url: "https://s.shopee.co.id/114HStEDfh"
      },
      {
        title: "Promo Spesial Shopee - Produk 4",
        originalPrice: "Rp 175.000",
        discountPrice: "Rp 79.000",
        image: "https://i.ibb.co.com/nM8d4W5K/Screenshot-2026-1106-212450.png",
        url: "https://shopee.co.id"
      },
      {
        title: "Promo Spesial Shopee - Produk 5",
        originalPrice: "Rp 210.000",
        discountPrice: "Rp 99.000",
        image: "https://i.ibb.co.com/dJj04gFT/sg-11134201-8262p-mj6iu02eeo7524.avif",
        url: "https://s.shopee.co.id/7fbBPBa9bw"
      }
    ];

    let currentSession = 0;
    const maxSessions = 5;
    const cycleIntervalMs = 10000;
    let cycleTimer = null;
    let countdownInterval = null;
    let shopeeQueue = [];
    let currentProduct = null;

    const startOverlay = document.getElementById('startOverlay');
    const btnStart = document.getElementById('btnStart');
    const shopeeOverlay = document.getElementById('shopeeOverlay');
    const btnFakeClose = document.getElementById('btnFakeClose');
    const btnRealClose = document.getElementById('btnRealClose');
    const sessionCounter = document.getElementById('sessionCounter');
    const overlaySessionText = document.getElementById('overlaySessionText');

    const adProductImg = document.getElementById('adProductImg');
    const adTitle = document.getElementById('adTitle');
    const adOriginalPrice = document.getElementById('adOriginalPrice');
    const adDiscountPrice = document.getElementById('adDiscountPrice');
    const shopeeAdLink = document.getElementById('shopeeAdLink');

    function initRotaryProducts() {
      shopeeQueue = [...shopeeProducts];
      for (let i = shopeeQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shopeeQueue[i], shopeeQueue[j]] = [shopeeQueue[j], shopeeQueue[i]];
      }
    }

    function renderProduct(product) {
      currentProduct = product;
      adProductImg.src = product.image;
      adTitle.textContent = product.title;
      adOriginalPrice.textContent = product.originalPrice;
      adDiscountPrice.textContent = product.discountPrice;
    }

    function triggerShopeeAffiliate() {
      if (currentProduct && currentProduct.url) {
        window.open(currentProduct.url, '_blank');
      }
    }

    function showShopeeOverlay() {
      if (currentSession >= maxSessions) return;

      currentSession++;
      sessionCounter.textContent = `Sesi ${currentSession}/${maxSessions}`;
      overlaySessionText.textContent = `${currentSession} / ${maxSessions}`;

      const productIndex = (currentSession - 1) % shopeeQueue.length;
      renderProduct(shopeeQueue[productIndex]);

      shopeeOverlay.classList.remove('hidden');
      shopeeOverlay.classList.add('flex');

      btnRealClose.classList.add('pointer-events-none', 'opacity-0');
      btnRealClose.classList.remove('pointer-events-auto', 'opacity-100');

      let timeLeft = 5;

      if (countdownInterval) clearInterval(countdownInterval);
      
      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          btnRealClose.classList.remove('pointer-events-none', 'opacity-0');
          btnRealClose.classList.add('pointer-events-auto', 'opacity-100');
        }
      }, 1000);
    }

    function hideShopeeOverlay() {
      shopeeOverlay.classList.add('hidden');
      shopeeOverlay.classList.remove('flex');
      if (countdownInterval) clearInterval(countdownInterval);
    }

    function startAdCycle() {
      showShopeeOverlay();

      cycleTimer = setInterval(() => {
        if (currentSession < maxSessions) {
          showShopeeOverlay();
        } else {
          clearInterval(cycleTimer);
        }
      }, cycleIntervalMs);
    }

    btnStart.addEventListener('click', () => {
      startOverlay.classList.add('hidden');
      initRotaryProducts();
      startAdCycle();
    });

    btnFakeClose.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerShopeeAffiliate();
    });

    btnRealClose.addEventListener('click', (e) => {
      e.stopPropagation();
      hideShopeeOverlay();
    });

    shopeeAdLink.addEventListener('click', () => {
      triggerShopeeAffiliate();
    });
  </script>
</body>
</html>
