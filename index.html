<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1zey - Video Gallery & Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex items-center justify-center p-2">

    <!-- KONTAINER UTAMA PERSPEKTIF 3D -->
    <div class="perspective-1000 w-full max-w-md h-[92vh] max-h-[850px] relative">
        
        <!-- KARTU FLIPPER -->
        <div id="card-flipper" class="w-full h-full relative transform-style-3d transition-transform duration-700 ease-in-out">

            <!-- BAGIAN DEPAN: GALERI VIDEO (6 PER HALAMAN) -->
            <div class="absolute inset-0 w-full h-full bg-slate-900 border border-slate-800 rounded-2xl flex flex-col justify-between p-4 backface-hidden shadow-2xl">
                <!-- Header -->
                <header class="py-2 border-b border-slate-800 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center font-bold text-slate-950 text-base shadow-md">V</div>
                        <span class="text-lg font-extrabold tracking-wider text-amber-400">V1zey</span>
                    </div>
                    <span id="page-indicator" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300 border border-slate-700">Hal 1 dari 2</span>
                </header>

                <!-- Grid Video -->
                <main class="my-3 flex-grow overflow-y-auto">
                    <div id="video-grid" class="grid grid-cols-2 gap-3">
                        <!-- Dimuat via JS -->
                    </div>
                </main>

                <!-- Paginasi -->
                <footer class="pt-2 border-t border-slate-800 flex justify-between items-center">
                    <button id="btn-prev" onclick="changePage(-1)" class="px-4 py-2 bg-slate-800 text-xs font-semibold rounded-lg border border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed">Sebelumnya</button>
                    <button id="btn-next" onclick="changePage(1)" class="px-4 py-2 bg-slate-800 text-xs font-semibold rounded-lg border border-slate-700">Selanjutnya</button>
                </footer>
            </div>


            <!-- BAGIAN BELAKANG: PEMUTAR VIDEO (IFRAME / VIDEO PLAYER) -->
            <div class="absolute inset-0 w-full h-full bg-black rounded-2xl flex flex-col justify-between overflow-hidden backface-hidden rotate-y-180 shadow-2xl border border-slate-800">
                
                <!-- Header Pemutar -->
                <header class="px-4 py-3 bg-gradient-to-b from-black/90 to-transparent flex items-center justify-between z-10">
                    <div class="flex items-center space-x-2 truncate">
                        <div class="w-7 h-7 bg-amber-500 rounded-lg flex items-center justify-center font-bold text-slate-950 text-xs flex-shrink-0">V</div>
                        <span class="text-sm font-bold text-amber-400 flex-shrink-0">V1zey</span>
                        <span class="text-slate-500 text-xs">|</span>
                        <span id="player-title" class="text-xs text-slate-300 truncate">Judul Video</span>
                    </div>
                </header>

                <!-- Kartu Pemutar Video -->
                <div class="relative flex-grow flex items-center justify-center bg-zinc-950 overflow-hidden">
                    <iframe id="main-video-frame" class="w-full h-full border-0" allowfullscreen allow="autoplay"></iframe>

                    <!-- Iklan 1: Pesan Chat (Di Atas - Ukuran Lebih Besar) -> Smartlink 2 -->
                    <div id="ad-chat" class="absolute top-3 left-3 right-3 bg-slate-900/95 border border-slate-700 text-white p-3.5 rounded-xl shadow-2xl transform -translate-y-36 opacity-0 transition-all duration-500 flex items-center space-x-3.5 z-20 backdrop-blur-md">
                        <a href="https://apiguinee.org/4/f48d1b3a91d0b1fd3db51c3c384a044b" target="_blank" onclick="handleAdClick(2)" class="relative flex-shrink-0">
                            <img id="chat-avatar" src="" alt="Avatar Wanita" class="w-14 h-14 rounded-full object-cover border-2 border-amber-500 shadow-md">
                            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                        </a>
                        <a href="https://apiguinee.org/4/f48d1b3a91d0b1fd3db51c3c384a044b" target="_blank" onclick="handleAdClick(2)" class="flex-grow">
                            <div class="flex items-center justify-between">
                                <p id="chat-sender" class="text-xs font-bold text-indigo-400">Jessica</p>
                                <span class="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">Pesan Baru</span>
                            </div>
                            <p id="chat-message" class="text-xs text-slate-200 mt-1 line-clamp-2">Halo ganteng, tonton video lengkapku yuk...</p>
                        </a>
                        <button onclick="closeAdChat(event)" class="text-slate-400 hover:text-white text-sm font-bold p-1 self-start">✕</button>
                    </div>

                    <!-- Iklan 2: In-Page Push (Di Bawah - Tinggi Hampir Setengah Layar / Memuat Video) -> Smartlink 1 -->
                    <div id="ad-push" class="absolute bottom-3 left-3 right-3 bg-slate-900/95 border border-amber-500/50 text-white p-3.5 rounded-2xl shadow-2xl transform translate-y-96 opacity-0 transition-all duration-500 flex flex-col justify-between z-20 backdrop-blur-md max-h-[48%]">
                        <!-- Header Push -->
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-amber-400 text-sm">🔥</span>
                                <p id="push-title" class="text-xs font-bold text-amber-400 line-clamp-1">Promo Khusus</p>
                            </div>
                            <button onclick="closeAdPush(event)" class="text-slate-400 hover:text-white text-sm font-bold px-1.5 py-0.5 bg-slate-800 rounded-full">✕</button>
                        </div>
                        
                        <!-- Media Video Iklan (Hampir Setengah Layar Pemutar) -->
                        <a href="https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe" target="_blank" onclick="handleAdClick(1)" class="w-full flex-grow bg-black rounded-xl overflow-hidden relative border border-slate-700 min-h-[140px] max-h-[180px] block">
                            <video id="push-video" autoplay muted loop playsinline class="w-full h-full object-cover"></video>
                            <div class="absolute inset-0 bg-black/10 flex items-center justify-center">
                                <span class="bg-amber-500/90 text-slate-950 text-[10px] font-bold px-2 py-1 rounded-full shadow-lg">▶ Ketuk untuk Nonton</span>
                            </div>
                        </a>

                        <div class="mt-2 flex items-center justify-between">
                            <p id="push-desc" class="text-[11px] text-slate-300 line-clamp-1">Tonton video selengkapnya sekarang!</p>
                            <a href="https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe" target="_blank" onclick="handleAdClick(1)" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-4 py-1.5 rounded-lg transition-colors flex-shrink-0">Buka</a>
                        </div>
                    </div>
                </div>

                <!-- Bagian Bawah: Tombol Kembali (Tidak Memicu Smartlink) -->
                <footer class="p-3 bg-slate-950 border-t border-slate-900 z-10">
                    <button onclick="backToGallery()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold rounded-xl text-xs transition-colors border border-slate-700 shadow-md">
                        ← Kembali ke Pilihan Video
                    </button>
                </footer>
            </div>

        </div>
    </div>

    <!-- SCRIPT APLIKASI -->
    <script>
        const SMARTLINK_1 = "https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe";
        const SMARTLINK_2 = "https://apiguinee.org/4/f48d1b3a91d0b1fd3db51c3c384a044b";

        // Daftar Video Resmi (Menggunakan endpoint /e/)
        const videos = [
            { id: "11106009", title: "Video ID: 11106009", src: "https://vidxxx.vip/e/k7allemk", thumb: "https://picsum.photos/seed/11106009/300/200" },
            { id: "11106008", title: "Video ID: 11106008", src: "https://vidxxx.vip/e/9pe7au0e", thumb: "https://picsum.photos/seed/11106008/300/200" },
            { id: "11106006", title: "Video ID: 11106006", src: "https://vidxxx.vip/e/61p1d4ap", thumb: "https://picsum.photos/seed/11106006/300/200" },
            { id: "11106005", title: "Video ID: 11106005", src: "https://vidxxx.vip/e/13ojawj1", thumb: "https://picsum.photos/seed/11106005/300/200" },
            { id: "11106004", title: "Video ID: 11106004", src: "https://vidxxx.vip/e/f1dj11a1", thumb: "https://picsum.photos/seed/11106004/300/200" },
            { id: "11106003", title: "Video ID: 11106003", src: "https://vidxxx.vip/e/30n4j4n3", thumb: "https://picsum.photos/seed/11106003/300/200" },
            { id: "11106002", title: "Video ID: 11106002", src: "https://vidxxx.vip/e/b9llec6t", thumb: "https://picsum.photos/seed/11106002/300/200" },
            { id: "11106001", title: "Video ID: 11106001", src: "https://vidxxx.vip/e/5glkzufn", thumb: "https://picsum.photos/seed/11106001/300/200" },
            { id: "11103001", title: "Video ID: 11103001", src: "https://vidxxx.vip/e/ory448l3", thumb: "https://picsum.photos/seed/11103001/300/200" }
        ];

        // 3 Foto Iklan Pesan Chat Sesuai Permintaan
        const chatAvatars = [
            "https://i.ibb.co/ks6RHwmS/e58e5f3dbc23f2a42b07b9d7149312ed.jpg",
            "https://i.ibb.co/ccnPMG52/d3f7c0b676a9dde5db9edaecd74f6c21.jpg",
            "https://i.ibb.co/twspN4M6/193c6dad2b319045f013e74981d25f54.jpg"
        ];

        // 3 Video Iklan In-Page Push Sesuai Permintaan (Videy.co)
        const pushVideos = [
            "https://videy.co/v/?id=ENOlSaoU1",
            "https://videy.co/v/?id=EiLWpYZg1",
            "https://videy.co/v/?id=7aTdoZW71"
        ];

        // Variasi Konten 3 Siklus Iklan
        const adVariations = [
            {
                chatSender: "Siska (Online)",
                chatMsg: "Kamu lagi sendirian ya? Main yuk, klik di sini...",
                pushTitle: "🔥 HOT Preview Video Eksklusif #1",
                pushDesc: "Tonton durasi penuh kualitas HD gratis sekarang!"
            },
            {
                chatSender: "Angelica VIP",
                chatMsg: "Pesan privat: Aku udah kirim video baru khusus buatmu!",
                pushTitle: "⚡ LIVE Stream Spesial Malam Ini",
                pushDesc: "Siaran langsung eksklusif sedang berlangsung!"
            },
            {
                chatSender: "Dina Kirim Video...",
                chatMsg: "Kirim video singkat (00:45) - Klik untuk putar",
                pushTitle: "🎬 Rekomendasi Video Pilihan Populer",
                pushDesc: "Klik untuk membuka tautan pemutar video"
            }
        ];

        let currentPage = 1;
        const itemsPerPage = 6;

        let adCount = 0;
        let adReappearTimer = null;
        let chatAdTimer = null;
        let firstAdTimeout = null;
        let isAdVisible = false;

        const cardFlipper = document.getElementById("card-flipper");
        const videoGrid = document.getElementById("video-grid");
        const pageIndicator = document.getElementById("page-indicator");
        const btnPrev = document.getElementById("btn-prev");
        const btnNext = document.getElementById("btn-next");
        const mainVideoFrame = document.getElementById("main-video-frame");
        const playerTitle = document.getElementById("player-title");
        const adChat = document.getElementById("ad-chat");
        const adPush = document.getElementById("ad-push");

        const chatAvatar = document.getElementById("chat-avatar");
        const chatSender = document.getElementById("chat-sender");
        const chatMessage = document.getElementById("chat-message");
        const pushVideo = document.getElementById("push-video");
        const pushTitle = document.getElementById("push-title");
        const pushDesc = document.getElementById("push-desc");

        function renderGallery() {
            videoGrid.innerHTML = "";
            let start = (currentPage - 1) * itemsPerPage;
            let end = start + itemsPerPage;
            let paginatedItems = videos.slice(start, end);

            paginatedItems.forEach(video => {
                let card = document.createElement("div");
                card.className = "bg-slate-950 border border-slate-800 rounded-xl overflow-hidden shadow-md cursor-pointer hover:border-amber-500 transition-all";
                card.onclick = () => onVideoClick(video);
                card.innerHTML = `
                    <div class="relative aspect-video bg-slate-800">
                        <img src="${video.thumb}" alt="${video.title}" loading="lazy" class="w-full h-full object-cover">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/30 hover:bg-black/10 transition-colors">
                            <div class="w-8 h-8 bg-amber-500/90 rounded-full flex items-center justify-center text-slate-950 font-bold text-xs shadow-lg">▶</div>
                        </div>
                    </div>
                    <div class="p-2">
                        <h2 class="text-[11px] font-semibold text-slate-200">${video.title}</h2>
                    </div>
                `;
                videoGrid.appendChild(card);
            });

            let totalPages = Math.ceil(videos.length / itemsPerPage);
            pageIndicator.innerText = `Hal ${currentPage} dari ${totalPages}`;
            btnPrev.disabled = currentPage === 1;
            btnNext.disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            let totalPages = Math.ceil(videos.length / itemsPerPage);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderGallery();
        }

        function onVideoClick(video) {
            window.open(SMARTLINK_1, '_blank');
            playVideo(video);
        }

        function playVideo(video) {
            playerTitle.innerText = video.title;
            mainVideoFrame.src = video.src;
            
            cardFlipper.classList.add("rotate-y-180");

            resetAdState();
            startAdCountdown();
        }

        function backToGallery() {
            mainVideoFrame.src = "";
            pushVideo.src = "";
            resetAdState();
            cardFlipper.classList.remove("rotate-y-180");
        }

        function startAdCountdown() {
            if (firstAdTimeout) clearTimeout(firstAdTimeout);
            firstAdTimeout = setTimeout(() => {
                triggerAdShowSequence();
            }, 15000); // 15 Detik
        }

        function triggerAdShowSequence() {
            if (adCount >= 3 || isAdVisible) return;

            let currentCycle = adCount; 
            let variation = adVariations[currentCycle];

            // Update Pesan Chat
            chatAvatar.src = chatAvatars[currentCycle];
            chatSender.innerText = variation.chatSender;
            chatMessage.innerText = variation.chatMsg;

            // Update In-Page Push (Video Iklan)
            pushVideo.src = pushVideos[currentCycle];
            pushTitle.innerText = variation.pushTitle;
            pushDesc.innerText = variation.pushDesc;

            adCount++;
            isAdVisible = true;

            // 1. Munculkan Pesan Chat di Atas
            adChat.classList.remove("-translate-y-36", "opacity-0");
            adChat.classList.add("translate-y-0", "opacity-100");

            // 2. Munculkan In-Page Push di Bawah setelah jeda 0,5 detik
            chatAdTimer = setTimeout(() => {
                adPush.classList.remove("translate-y-96", "opacity-0");
                adPush.classList.add("translate-y-0", "opacity-100");
            }, 500);
        }

        function hideAds() {
            adChat.classList.remove("translate-y-0", "opacity-100");
            adChat.classList.add("-translate-y-36", "opacity-0");

            adPush.classList.remove("translate-y-0", "opacity-100");
            adPush.classList.add("translate-y-96", "opacity-0");

            pushVideo.src = "";
            isAdVisible = false;
        }

        function handleAdClick(adNumber) {
            handleAdDismissal();
        }

        // Tombol X In-Page Push (Memicu Smartlink 1)
        function closeAdPush(event) {
            event.stopPropagation();
            window.open(SMARTLINK_1, '_blank');
            handleAdDismissal();
        }

        // Tombol X Pesan Chat (Memicu Smartlink 2)
        function closeAdChat(event) {
            event.stopPropagation();
            window.open(SMARTLINK_2, '_blank');
            handleAdDismissal();
        }

        function handleAdDismissal() {
            hideAds();

            if (adCount < 3) {
                if (adReappearTimer) clearTimeout(adReappearTimer);
                adReappearTimer = setTimeout(() => {
                    triggerAdShowSequence();
                }, 3000); // 3 Detik
            }
        }

        function resetAdState() {
            adCount = 0;
            isAdVisible = false;
            if (firstAdTimeout) clearTimeout(firstAdTimeout);
            if (adReappearTimer) clearTimeout(adReappearTimer);
            if (chatAdTimer) clearTimeout(chatAdTimer);
            hideAds();
        }

        renderGallery();
    </script>
</body>
</html>
