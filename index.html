        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .card-container {
            width: 100%;
            max-width: 480px;
            height: 760px;
            perspective: 1000px;
        }

        .flip-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background: #1a1a1a;
        }

        /* --- SISI DEPAN: DASHBOARD XPIDIOSS --- */
        .card-front {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
            overflow-y: auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 2px;
            padding-bottom: 4px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            color: #ff5722;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 2px 4px 10px rgba(255, 87, 34, 0.5), 0px 5px 2px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: baseline;
        }

        .logo-x {
            font-size: 52px;
            line-height: 0.7;
            display: inline-block;
            transform: translateY(4px);
        }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
        }

        .search-box input {
            flex-grow: 1;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            font-size: 11.5px;
        }

        .search-box button {
            background: #ff5722;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
        }

        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }

        .cat-btn {
            background: #222;
            color: #bbb;
            border: 1px solid #333;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #ff5722;
            color: #fff;
            border-color: #ff5722;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 4px;
        }

        .gallery-item {
            position: relative;
            height: 105px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1.5px solid #333;
            background: #000;
            transition: transform 0.2s, border-color 0.2s;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            border-color: #ff5722;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
        }

        .badge-cat {
            position: absolute;
            top: 3px;
            left: 3px;
            background: rgba(255, 87, 34, 0.85);
            font-size: 7.5px;
            padding: 2px 4px;
            border-radius: 3px;
            text-transform: uppercase;
            z-index: 2;
        }

        .badge-duration {
            position: absolute;
            top: 3px;
            right: 3px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 3px;
            z-index: 2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .pagination button {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 3px 9px;
            font-size: 10.5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .pagination button.active {
            background: #ff5722;
            border-color: #ff5722;
        }

        .native-banners-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .native-banner {
            display: flex;
            align-items: center;
            background: #1e1e1e;
            border: 1.5px solid #333;
            border-radius: 10px;
            padding: 8px 12px;
            text-decoration: none;
            color: #fff;
            transition: border-color 0.2s, background 0.2s;
        }

        .native-banner:hover {
            border-color: #ff5722;
            background: #252525;
        }

        .native-banner img {
            width: 72px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .native-banner-info {
            flex-grow: 1;
        }

        .native-banner-tag {
            font-size: 9px;
            color: #ff5722;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .native-banner-title {
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.3;
            color: #f0f0f0;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #000;
        }

        .main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-back-gallery {

            right: 12px;
            background: rgba(0,0,0,0.6);

            border-radius: 20px;

            font-size: 12px;

            right: 12px;

            border-radius: 14px;
            padding: 10px 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            z-index: 10;

        .ad-chat-header {

            border-radius: 50%;

        .ad-chat-info {
            flex-grow: 1;
            color: #333;
            font-size: 11px;
        }
        .ad-chat-tag {
            color: #d32f2f;
            font-size: 9.5px;
            font-weight: bold;
            margin-bottom: 2px;

            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(255, 87, 34, 0.4);

        .pos-ad2-left { position: absolute; bottom: 20px; left: 12px; width: 175px; height: 280px; }
        .pos-ad2-right { position: absolute; top: 130px; right: 12px; width: 58%; height: 310px; }
        .pos-ad3-right { position: absolute; top: 130px; right: 12px; width: 58%; height: 310px; }
        .pos-ad3-left { position: absolute; bottom: 20px; left: 12px; width: 175px; height: 280px; }

        .ad-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 1.5px solid rgba(255,255,255,0.3);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 10;
            cursor: pointer;
        }
        .ad-box video, .ad-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .ad-caption-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 20%, transparent);

        .shake-animation {

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px) rotate(-2deg); }
            40% { transform: translateX(6px) rotate(2deg); }
            60% { transform: translateX(-4px) rotate(-1deg); }

            { title: "Si cantik mendesah digenjot gebetan", category: "Gadis", thumb: "https://i.ibb.co.com/wNx33LMy/Screenshot-2026-1110-095741.png", src: "https://cdn.videy.co/YXOVsNZb1.mp4", duration: "11:20" },
            { title: "Abg SMA masih pakai seragam", category: "SMA", thumb: "https://i.ibb.co.com/238nXSNP/Screenshot-2026-1110-100045.png", src: "https://cdn.videy.co/Txc5Ns6M1.mp4", duration: "1:22" },
            { title: "Janda goyang wot dengan selingkuhan", category: "Janda", thumb: "https://i.ibb.co.com/bjZMS6X6/Screenshot-2026-1110-100143.png", src: "https://cdn.videy.co/1ZOchBZN1.mp4", duration: "4:50" }
        ];

        const ad1Pool = [
            { text: "Halo kak! Tonton video full versi tanpa sensor sekarang...", avatar: "https://i.ibb.co.com/N2W921ZS/d3f7c0b676a9dde5db9edaecd74f6c21.jpg" },
            { text: "UPDATE BARU: Video viral pilihan sudah siap di-play. Klik balas kak!", avatar: "https://i.ibb.co.com/gZ39Bg9s/e58e5f3dbc23f2a42b07b9d7149312ed.jpg" },
            { text: "BOCORAN EXCLUSIVE: Durasi panjang tanpa jeda khusus malam ini!", avatar: "https://i.ibb.co.com/9H2RFtdp/193c6dad2b319045f013e74981d25f54.jpg" }
        ];

        const ad2Pool = [
            { src: "https://cdn.videy.co/BHZMU2YF1.mp4", text: "🔥 Klik Nonton Versi Full HD (Autoplay)" },
            { src: "https://cdn.videy.co/TNEvMz2i1.mp4", text: "⚡ Pemutaran Video Viral Push #2 Terpopuler" },
            { src: "https://cdn.videy.co/2mm2QsAg1.mp4", text: "🔞 Tonton Video Push Viral 3 (Kualitas 1080p)" }
        ];

        const ad3Pool = [
            { src: "https://i.ibb.co/jv92HCQf/90eee1789b9ed3143b1e795c29d18001.jpg", text: "🔞 Video Viral Pilihan (Tanpa Sensor)" },
            { src: "https://i.ibb.co/BH7qxMLJ/HVevw-YMaw-AE68nn.jpg", text: "⭐ Koleksi Selebgram Viral Terbaru 2026" },
            { src: "https://i.ibb.co/B2Rmzpg6/HWf-M3xzb-YAAyk-EB.jpg", text: "▶️ Klik Gambar Ini Untuk Buka Full Durasi" }
        ];

        let currentPage = 1;
        const itemsPerPage = 6;
        let currentFilteredVideos = [...allVideos];
        let activeCategory = 'All';

        const videoGrid = document.getElementById('videoGrid');
        const paginationContainer = document.getElementById('pagination');

        function renderDashboard() {
            videoGrid.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = currentFilteredVideos.slice(start, end);

            paginatedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.onclick = () => putarVideo(item.src);
                div.innerHTML = `
                    <span class="badge-cat">${item.category}</span>
                    <span class="badge-duration">${item.duration}</span>
                    <img src="${item.thumb}" alt="${item.title}">
                    <div class="gallery-item-title">${item.title}</div>
                `;
                videoGrid.appendChild(div);
            });

            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(currentFilteredVideos.length / itemsPerPage);
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.innerText = 'Prev';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderDashboard(); } };
            paginationContainer.appendChild(prevBtn);

            let startPage, endPage;
            if (totalPages <= 4) {
                startPage = 1;
                endPage = totalPages;
            } else {
                if (currentPage <= 2) {
                    startPage = 1;
                    endPage = 4;
                } else if (currentPage >= totalPages - 1) {
                    startPage = totalPages - 3;
                    endPage = totalPages;
                } else {
                    startPage = currentPage - 1;
                    endPage = currentPage + 2;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                if (i === currentPage) btn.className = 'active';
                btn.onclick = () => { currentPage = i; renderDashboard(); };
                paginationContainer.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.innerText = 'Next';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderDashboard(); } };
            paginationContainer.appendChild(nextBtn);
        }

        function cariVideo() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            currentFilteredVideos = allVideos.filter(v => 
                (activeCategory === 'All' || v.category === activeCategory) &&
                (v.title.toLowerCase().includes(query) || v.category.toLowerCase().includes(query))
            );
            currentPage = 1;
            renderDashboard();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === cat || (cat === 'All' && btn.innerText === 'Semua')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (cat === 'All') {
                currentFilteredVideos = [...allVideos];
            } else {
                currentFilteredVideos = allVideos.filter(v => v.category === cat);
            }
            currentPage = 1;
            renderDashboard();
        }

        renderDashboard();

        const flipCard = document.getElementById('flipCard');
        const mainVideo = document.getElementById('mainVideo');
        const pushVideoElement = document.getElementById('pushVideoElement');
        
        const adChat = document.getElementById('adChat');
        const ad1Avatar = document.getElementById('ad1Avatar');
        const ad1Text = document.getElementById('ad1Text');
        
        const adPushVideo = document.getElementById('adPushVideo');
        const ad2Caption = document.getElementById('ad2Caption');

        const adPushImage = document.getElementById('adPushImage');
        const ad3Image = document.getElementById('ad3Image');
        const ad3Caption = document.getElementById('ad3Caption');

        let adData = {
            1: { cycles: 0, closed: true, timer: null },
            2: { cycles: 0, closed: true, timer: null },
            3: { cycles: 0, closed: true, timer: null }
        };

        let session = 1;
        let sessionTimer = null;
        let initialTriggered = false;

        function putarVideo(videoSrc) {
            triggerSmartlink1();

            mainVideo.src = videoSrc;
            flipCard.classList.add('flipped');
            resetAllAdsState();

            setTimeout(() => {
                mainVideo.play().catch(e => console.log(e));
            }, 400);
        }

        function kembaliKeGaleri() {
            mainVideo.pause();
            pushVideoElement.pause();
            flipCard.classList.remove('flipped');
            clearAllTimers();
        }

        function resetAllAdsState() {
            clearAllTimers();
            adData = {
                1: { cycles: 0, closed: true, timer: null },
                2: { cycles: 0, closed: true, timer: null },
                3: { cycles: 0, closed: true, timer: null }
            };
            session = 1;
            initialTriggered = false;
            applySessionLayout();
            adChat.style.display = 'none';
            adPushVideo.style.display = 'none';
            adPushImage.style.display = 'none';
        }

        function clearAllTimers() {
            clearTimeout(sessionTimer);
            Object.values(adData).forEach(ad => clearTimeout(ad.timer));
        }

        function applySessionLayout() {
            if (session === 1) {
                adPushVideo.className = "ad-box pos-ad2-left";
                adPushImage.className = "ad-box pos-ad3-right";
            } else {
                adPushVideo.className = "ad-box pos-ad2-right";
                adPushImage.className = "ad-box pos-ad3-left";
            }
        }

        function updateAdContent(id) {
            let cycleIndex = adData[id].cycles - 1; 
            let poolIndex = (session === 1) ? cycleIndex : (cycleIndex + 1) % 3;

            if (id === 1) {
                let ad = ad1Pool[poolIndex];
                ad1Avatar.src = ad.avatar;
                ad1Text.innerText = ad.text;
            } else if (id === 2) {
                let ad = ad2Pool[poolIndex];
                pushVideoElement.src = ad.src;
                pushVideoElement.load();
                ad2Caption.innerText = ad.text;
            } else if (id === 3) {
                let ad = ad3Pool[poolIndex];
                ad3Image.src = ad.src;
                ad3Caption.innerText = ad.text;
            }
        }

        function tutupIklan(id, event) {
            event.stopPropagation(); 

            if (id === 1) {
                triggerSmartlink2();
            } else {
                triggerSmartlink1();
            }

            if (id === 1) adChat.style.display = 'none';
            if (id === 2) {
                adPushVideo.style.display = 'none';
                pushVideoElement.pause();
            }
            if (id === 3) {
                adPushImage.style.display = 'none';
                adPushImage.classList.remove('shake-animation');
            }

            adData[id].closed = true;
            checkAndScheduleReopen(id);
            checkSessionCompletion();
        }

        function checkAndScheduleReopen(id) {
            if (adData[id].cycles < 3) {
                adData[id].timer = setTimeout(() => {
                    if (!flipCard.classList.contains('flipped')) return;
                    
                    adData[id].cycles++;
                    adData[id].closed = false;
                    
                    updateAdContent(id);

                    if (id === 1) adChat.style.display = 'flex';
                    if (id === 2) {
                        adPushVideo.style.display = 'block';
                        pushVideoElement.play().catch(e => console.log(e));
                    }
                    if (id === 3) {
                        adPushImage.style.display = 'block';
                        adPushImage.classList.add('shake-animation');
                        setTimeout(() => adPushImage.classList.remove('shake-animation'), 2000);
                    }
                }, 5000);
            }
        }

        function checkSessionCompletion() {
            const allFinished = Object.values(adData).every(ad => ad.cycles >= 3 && ad.closed);
            
            if (allFinished && session === 1) {
                sessionTimer = setTimeout(() => {
                    if (!flipCard.classList.contains('flipped')) return;
                    
                    session = 2;
                    applySessionLayout();
                    
                    adData = {
                        1: { cycles: 1, closed: false, timer: null },
                        2: { cycles: 1, closed: false, timer: null },
                        3: { cycles: 1, closed: false, timer: null }
                    };

                    [1, 2, 3].forEach(id => updateAdContent(id));

                    adChat.style.display = 'flex';
                    adPushVideo.style.display = 'block';
                    pushVideoElement.play().catch(e => console.log(e));
                    adPushImage.style.display = 'block';
                    adPushImage.classList.add('shake-animation');
                    setTimeout(() => adPushImage.classList.remove('shake-animation'), 2000);

                }, 60000);
            }
        }

        mainVideo.addEventListener('timeupdate', () => {
            const currentTime = mainVideo.currentTime;

            if (!initialTriggered && currentTime >= 10) {
                initialTriggered = true;
                
                [1, 2, 3].forEach(id => {
                    adData[id].cycles = 1;
                    adData[id].closed = false;
                    updateAdContent(id);
                });

                adChat.style.display = 'flex';

                setTimeout(() => {
                    if(flipCard.classList.contains('flipped')) {
                        adPushVideo.style.display = 'block';
                        pushVideoElement.play().catch(e => console.log(e));
                    }
                }, 1000);

                setTimeout(() => {
                    if(flipCard.classList.contains('flipped')) {
                        adPushImage.style.display = 'block';
                        adPushImage.classList.add('shake-animation');
                        setTimeout(() => adPushImage.classList.remove('shake-animation'), 2000);
                    }
                }, 2000);
            }
        });
    </script>
</body>
